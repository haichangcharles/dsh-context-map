name: E2E

# Ordinary events replay saved model responses; model APIs require explicit dispatch.
# Never use pull_request_target to run untrusted code with repository credentials.
on:
  workflow_dispatch:
    inputs:
      real_api:
        description: Authorize paid DeepSeek profile and installed-wheel API tests
        type: boolean
        required: false
        default: false
      runtime_diagnostics:
        description: Run only keyless native lifecycle and prompt diagnostics
        type: boolean
        required: false
        default: false
      native_debugger:
        description: Capture the original Windows native lane under Microsoft CDB, including forks
        type: boolean
        default: false
      native_debugger_mode:
        description: Launch under CDB or attach only after an unhandled crash
        type: choice
        options: [launch, postmortem]
        default: launch
      diagnostic_node:
        description: Node version for manual keyless diagnostics only
        type: choice
        options: ['24', '22']
        default: '24'
      worker_import_probe:
        description: Select the project, plain Node or tsx bootstrap diagnostic
        type: choice
        options: [project, pure, tsx, cancel-case]
        default: project
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    if: github.event_name != 'workflow_dispatch' || !inputs.runtime_diagnostics
    runs-on: ubuntu-latest
    name: e2e
    timeout-minutes: 45
    env:
      DEEPSEEK_API_KEY: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install (immutable)
        run: pnpm install --frozen-lockfile
      - name: Prepare bubblewrap (unrestrict userns)
        run: bash scripts/prepare-ci-bubblewrap.sh
      - name: Install Playwright Chromium and hosted dependencies
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium
      - name: Build full Context Map application
        run: pnpm run build
      - name: Replay recorded model Sessions
        env:
          DSH_SNAPSHOT: replay
        run: pnpm run test:snapshot
      - name: Replay browser end-to-end tests
        env:
          DSH_SNAPSHOT: replay
        run: pnpm run test:web:built

  runtime-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_diagnostics && !inputs.native_debugger
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    name: keyless native runtime diagnostics / ${{ matrix.os }}
    timeout-minutes: 10
    env:
      DEEPSEEK_API_KEY: ''
      SILICONFLOW_API_KEY: ''
      OPENAI_API_KEY: ''
      TYPESAFE_API_KEY: ''
      JEV_API_KEY: ''
      DSH_COVERAGE_MAX_WORKERS: '2'
      DSH_RUNTIME_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Enable Windows symlink support
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.diagnostic_node || '24' }}
          cache: pnpm
      - name: Install immutable dependencies
        if: inputs.worker_import_probe != 'pure'
        run: pnpm install --frozen-lockfile
      - name: Preserve native worker exit evidence
        if: inputs.worker_import_probe == 'project' || inputs.worker_import_probe == 'cancel-case'
        # Diagnostic-only adaptation of vitest-dev/vitest#10587. Keep the
        # installed package version and fail loudly if its handler changes.
        shell: pwsh
        run: |
          @'
          import { readFileSync, readdirSync, writeFileSync, renameSync } from 'node:fs';
          import { dirname, join } from 'node:path';
          import { fileURLToPath } from 'node:url';
          const chunks = join(dirname(fileURLToPath(import.meta.resolve('vitest/node'))), 'chunks');
          const matches = readdirSync(chunks).filter(name => /^cli-api\..+\.js$/.test(name));
          if (matches.length !== 1) throw new Error('Verify the upstream worker exit handler: bundle changed');
          const target = join(chunks, matches[0]);
          const before = readFileSync(target, 'utf8');
          const old = 'emitUnexpectedExit = () => {\n\t\tconst error = /* @__PURE__ */ new Error("Worker exited unexpectedly");';
          if (before.split(old).length !== 2) throw new Error('Verify the upstream worker exit handler before adapting diagnostics');
          const replacement = 'emitUnexpectedExit = (code, signal) => {\n\t\tconst error = new Error(`Worker exited unexpectedly (code=${code}, signal=${signal})`);';
          // Replace the directory entry, leaving pnpm store hardlinks intact.
          const temporary = target + '.dsh-diagnostic';
          writeFileSync(temporary, before.replace(old, replacement), { flag: 'wx' });
          renameSync(temporary, target);
          '@ | node --input-type=module
      - name: Prepare Windows crash evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\node.exe'
          if (Test-Path -LiteralPath $key) { throw 'Refuse to overwrite existing node.exe crash settings' }
          $folder = Join-Path $env:RUNNER_TEMP 'dsh-node-minidumps'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          New-Item -Path $key -Force | Out-Null
          try {
            New-ItemProperty -LiteralPath $key -Name DumpFolder -PropertyType ExpandString -Value $folder | Out-Null
            New-ItemProperty -LiteralPath $key -Name DumpType -PropertyType DWord -Value 1 | Out-Null
            New-ItemProperty -LiteralPath $key -Name DumpCount -PropertyType DWord -Value 2 | Out-Null
            "DSH_CRASH_CAPTURE_STARTED=$([DateTime]::UtcNow.ToString('o'))" >> $env:GITHUB_ENV
          } catch {
            Remove-Item -LiteralPath $key -Recurse -Force
            throw
          }
      - name: Diagnose workflow worker lifecycle
        if: inputs.worker_import_probe == 'project'
        run: >-
          pnpm exec vitest run --no-file-parallelism --maxWorkers=2
          --testTimeout 90000 --reporter=verbose
          packages/workflow/workflow-worker-thread/tests/workflow-worker-thread.spec.ts
          packages/workflow/tool-ralph/tests/integration.spec.ts
          packages/subprocess/subprocess-local/tests/process-exit.spec.ts
          packages/shell/tool-pwsh/tests/loader.spec.ts
      - name: Reproduce pure Node worker imports
        if: inputs.worker_import_probe == 'pure'
        shell: pwsh
        run: |
          node scripts/reproduce-worker-import.mjs esm 256
          if ($LASTEXITCODE -ne 0) { throw 'Pure Node ESM control failed' }
          node scripts/reproduce-worker-import.mjs cjs 256
          if ($LASTEXITCODE -ne 0) { throw 'Pure Node CJS import/termination failed' }
      - name: Reproduce tsx worker bootstrap
        if: inputs.worker_import_probe == 'tsx'
        shell: pwsh
        run: |
          node scripts/reproduce-worker-import.mjs tsx-esm 128 online
          if ($LASTEXITCODE -ne 0) { throw 'tsx ESM bootstrap control failed' }
          node scripts/reproduce-worker-import.mjs tsx-both 128 online
          if ($LASTEXITCODE -ne 0) { throw 'tsx ESM+CJS bootstrap failed' }
      - name: Repeat native cancellation case
        if: inputs.worker_import_probe == 'cancel-case'
        run: node scripts/reproduce-worker-death.mjs
      - name: Read Windows crash evidence
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          # Dumps stay on this disposable runner; emit exception/module/stack only.
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\node.exe'
          try {
            if (-not $env:DSH_CRASH_CAPTURE_STARTED) { throw 'Windows crash capture was not prepared' }
            try {
              Get-WinEvent -FilterHashtable @{ LogName='Application'; Id=1000,1001; StartTime=[DateTime]::Parse($env:DSH_CRASH_CAPTURE_STARTED) } -ErrorAction Stop |
                Where-Object { $_.Message -match 'node.exe' } | Format-List TimeCreated,Id,Message
            } catch {
              if ($_.FullyQualifiedErrorId -notlike 'NoMatchingEventsFound*') { throw }
              Write-Host 'No Windows application crash event was recorded'
            }
            $folder = Join-Path $env:RUNNER_TEMP 'dsh-node-minidumps'
            $dumps = @(Get-ChildItem -LiteralPath $folder -Filter '*.dmp')
            Write-Host "Node minidumps: $($dumps.Count)"
            $debugger = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Debuggers\x64\cdb.exe'
            if ($dumps.Count -gt 0 -and -not (Test-Path -LiteralPath $debugger)) {
              # Install only Microsoft's SDK debugger after a crash, leaving the probe unchanged.
              $installer = Join-Path $env:RUNNER_TEMP 'winsdksetup.exe'
              Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2272610' -OutFile $installer
              $signature = Get-AuthenticodeSignature -LiteralPath $installer
              if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
                throw 'Windows SDK installer signature is not valid Microsoft code'
              }
              $setup = Start-Process -FilePath $installer -ArgumentList '/features','OptionId.WindowsDesktopDebuggers','/quiet','/norestart' -PassThru -Wait -NoNewWindow
              if ($setup.ExitCode -notin 0,3010) { throw "Windows debugger install failed: $($setup.ExitCode)" }
            }
            if ($dumps.Count -gt 0 -and (Test-Path -LiteralPath $debugger)) {
              $symbols = Join-Path $env:RUNNER_TEMP 'dsh-node-symbols'
              New-Item -ItemType Directory -Path $symbols -Force | Out-Null
              $version = node -p 'process.version'
              $archive = Join-Path $symbols 'node_pdb.7z'
              Invoke-WebRequest "https://nodejs.org/dist/$version/win-x64/node_pdb.7z" -OutFile $archive
              7z x $archive "-o$symbols" -y
              if ($LASTEXITCODE -ne 0) { throw 'Cannot extract matching Node symbols' }
              foreach ($dump in $dumps) {
                & $debugger -z $dump.FullName -y "$symbols;srv*$symbols*https://msdl.microsoft.com/download/symbols" -c '.ecxr;k;q'
                if ($LASTEXITCODE -ne 0) { throw 'Cannot read Node crash stack' }
              }
            } elseif ($dumps.Count -gt 0) {
              Write-Host 'Windows SDK CDB is unavailable; crash stack remains unclassified'
            }
          } finally {
            if ($env:DSH_CRASH_CAPTURE_STARTED) { Remove-Item -LiteralPath $key -Recurse -Force }
          }
      - name: Prepare Linux native sandbox
        if: runner.os == 'Linux' && inputs.worker_import_probe == 'project'
        run: bash scripts/prepare-ci-bubblewrap.sh
      - name: Build host native addon
        if: inputs.worker_import_probe == 'project'
        run: pnpm run build:native-system
      - name: Diagnose native lifecycle and owned-prompt readiness
        if: inputs.worker_import_probe == 'project'
        # This is a selected, instrumented diagnostic, not the repository
        # coverage verdict. The ordinary exhaustive lane stays unchanged.
        env:
          DSH_COVERAGE_PARTITION_MODE: '1'
        run: >-
          pnpm exec vitest run
          packages/shell/bash-sandbox/tests/sandbox.spec.ts
          packages/subprocess/subprocess-local/tests/local.spec.ts
          packages/terminal/terminal-bash/tests/local.spec.ts
          packages/shell/tool-pwsh-persistent/tests/loader-composition.spec.ts
          packages/session/session-projection-cache/tests/fixtures.spec.ts
          --testNamePattern='disposal kills wrapped background jobs|disposal kills still-running processes and awaits their exit|bootstraps a persistent pwsh|preserves cwd and environment across calls|archived version recovery'
          --testTimeout=90000 --coverage
          --coverage.include='packages/subprocess/subprocess-local/src/**'
          --coverage.reportsDirectory=coverage/runtime-diagnostics

  native-debugger:
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_diagnostics && inputs.native_debugger
    runs-on: windows-2025
    name: keyless original Windows native lane / CDB
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ''
      SILICONFLOW_API_KEY: ''
      OPENAI_API_KEY: ''
      TYPESAFE_API_KEY: ''
      JEV_API_KEY: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Enable Windows symlink support
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-native-debugger
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - name: Install with the original native lane filesystem policy
        shell: pwsh
        run: >-
          $drive = (Split-Path -Qualifier $env:GITHUB_WORKSPACE).TrimEnd(':');
          $fs = (Get-Volume -DriveLetter $drive).FileSystem;
          if ($fs -eq 'ReFS') {
            corepack pnpm install --frozen-lockfile --package-import-method=clone
          } else {
            pnpm install --frozen-lockfile
          }
      - name: Verify postmortem registry restoration in private user keys
        shell: pwsh
        run: ./scripts/native-postmortem-registry.ps1 -SelfTest
      - name: Capture native exception stacks and verify all original cases
        shell: pwsh
        env:
          DSH_NATIVE_DEBUGGER_MODE: ${{ inputs.native_debugger_mode || 'launch' }}
        run: ./scripts/capture-native-debugger.ps1 -Mode $env:DSH_NATIVE_DEBUGGER_MODE

  real-api:
    if: github.event_name == 'workflow_dispatch' && inputs.real_api
    runs-on: ubuntu-latest
    name: real DeepSeek API (explicit opt-in)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The with-key escalation e2e self-skips without a usable runner. Prepare
      # bwrap so trusted CI exercises it; the functional probe remains the
      # authority on whether the runner can use the sandbox.
      - name: Prepare bubblewrap (unrestrict userns)
        run: bash scripts/prepare-ci-bubblewrap.sh

      # Guard against a false green: the e2e suites self-skip when the key is
      # absent, so a missing/misconfigured secret would otherwise pass as
      # "all skipped". Explicit dispatch expects the configured secret; fail
      # loudly rather than appearing to validate a live model.
      - name: Preflight (require DEEPSEEK_API_KEY)
        env:
          # Repo secret DEEPSEEK_API_KEY_EXTERNAL holds the external-API key;
          # the tests read process.env.DEEPSEEK_API_KEY, so map it across here.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::error::DEEPSEEK_API_KEY is empty. The e2e suite would self-skip and"
            echo "::error::report a false green. Configure the repo secret DEEPSEEK_API_KEY_EXTERNAL."
            exit 1
          fi
          echo "DEEPSEEK_API_KEY present."

      # The e2e suites boot the example bins in `lib` mode (DSH_EXAMPLE_MODE=lib):
      # the built artifact under plain Node, resolving plugins through real package
      # exports — the shape a real consumer runs. That requires a prior build.
      - name: Build (lib for the e2e example bins)
        run: pnpm run build:official

      # Real-API end-to-end tests only. The keyless gates (lint/typecheck/
      # coverage/snapshot/etc.) already run in ci.yml (pull requests) and
      # ci-master.yml (master push standby).
      # DEEPSEEK_BASE_URL is pinned to the external API; the secret is scoped to
      # this step (and preflight) only — never exposed to checkout/setup/install.
      - name: E2E tests (real DeepSeek API)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DSH_E2E_MAX_WORKERS: 4
          DSH_EXAMPLE_MODE: lib
        run: pnpm run test:e2e

  python-real-api:
    if: github.event_name == 'workflow_dispatch' && inputs.real_api
    name: installed-wheel real API (explicit opt-in)
    uses: ./.github/workflows/build-exe-for-python-sdk.yml
    with:
      targets: node24-linux-x64,node24-win-x64
      ci: true
      real_api: true
    secrets:
      DEEPSEEK_API_KEY_EXTERNAL: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
