# Credential-free compatibility packaging for the nine vendored Cordis
# packages inherited from DeepSeek Harness. This community repository ships a
# GitHub source release and must never publish the upstream npm packages.
name: Package compatibility (upstream vendor)

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Compatibility runs are isolated by ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  pack:
    name: Pack npm tarballs
    runs-on: ubuntu-24.04
    steps:
      # Complete history: the release scripts read tags.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: pnpm run release:verify --family vendor

      # The compatibility artifact includes the sources and build outputs that
      # the inherited manifests select.
      - name: Build
        run: pnpm run build:lib:host

      - name: Pack release tarballs
        run: pnpm run release:pack --family vendor --out dist/npm-vendor

      - name: Verify packed install
        run: pnpm run release:verify-packed-install --family vendor --from dist/npm-vendor

      - uses: actions/upload-artifact@v4
        with:
          name: vendor-npm-tarballs
          path: dist/npm-vendor/*
          if-no-files-found: error
          retention-days: 7
