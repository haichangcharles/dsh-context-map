name: Issue lifecycle

on:
  issues:
    types:
      - opened
      - edited
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - closed
      - reopened
      - field_added
      - field_removed
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - review_requested
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read

concurrency:
  group: issue-lifecycle-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Issue lifecycle
    # Runs on every pull_request_review event so the check reports success rather
    # than a gray "skipped" segment. The token-creating and board-mutating steps
    # are gated at step level (a skipped step does not gray the job): only a
    # changes_requested review drives the Project board; approved/commented
    # reviews never mint a write-capable App token.
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate repository policy implementation
        run: node --test .github/issue-management/policy.test.mjs
      - name: Check Project integration configuration
        id: project
        if: ${{ github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested' }}
        env:
          APP_CLIENT_ID: ${{ vars.DSH_ISSUE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.DSH_ISSUE_APP_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const config = JSON.parse(fs.readFileSync('.github/issue-management/config.json', 'utf8'))
          const target = `${config.organization}/${config.repository}`
          const configured = Boolean(process.env.APP_CLIENT_ID && process.env.APP_PRIVATE_KEY)
          const applicable = process.env.GITHUB_REPOSITORY === target
          if (applicable && Boolean(process.env.APP_CLIENT_ID) !== Boolean(process.env.APP_PRIVATE_KEY)) {
            throw new Error('Project integration configuration is incomplete; values are never printed')
          }
          const enabled = applicable && configured
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${enabled}\n`)
          if (!enabled) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            'Repository policy tests passed; Project board integration is not configured for this repository.\n')
          NODE
      - name: Create project token
        id: app-token
        if: ${{ steps.project.outputs.enabled == 'true' && (github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested') }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.DSH_ISSUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DSH_ISSUE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Handle repository event
        if: ${{ steps.project.outputs.enabled == 'true' && (github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested') }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node .github/issue-management/policy.mjs lifecycle
